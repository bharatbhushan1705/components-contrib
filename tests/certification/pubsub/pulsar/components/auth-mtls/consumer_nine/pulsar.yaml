apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: messagebus
spec:
  type: pubsub.pulsar
  version: v1
  metadata:
  - name: host
    value: "pulsar+ssl://localhost:6651"
  - name: enableTLS
    value: "true"
  - name: tlsCertFile
    value: "./config/certs/client.cert.pem"
  - name: tlsKeyFile
    value: "./config/certs/client.key-pk8.pem"
  - name: tlsTrustCertsFilePath
    value: "./config/certs/ca.cert.pem"
  - name: consumerID
    value: certification9
  - name: redeliveryDelay
    value: 200ms
  - name: certification-pubsub-topic-active.avroschema
    value: "{\"type\":\"record\",\"name\":\"Example\",\"namespace\":\"test\",\"fields\":[{\"name\":\"testId\",\"type\":\"int\"},{\"name\":\"testName\",\"type\":\"string\"}]}"